<svg width="680" height="706" viewBox="0 0 680 706" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MAQ Intelligent Client Delivery Agent architecture</title>
<desc>Teams flows into Copilot Studio, then an async Power Automate flow, into a FastAPI gateway with auth/PII/dedupe checks, into an orchestrator that runs a data retrieval agent and an insight agent, which pull from Azure DevOps via MCP, SharePoint and timesheets directly, and a hybrid RAG knowledge base.</desc>
