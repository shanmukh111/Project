trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.13'

stages:

- stage: Dev
  displayName: DEV
  jobs:
  - job: CompileCheck
    displayName: Compile/import sanity check
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies

    - script: |
        python -m compileall agents apps connectors mcp_server orchestration retrieval security reporting
      displayName: Python syntax validation


- stage: Test
  displayName: TEST
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - job: RunTests
    displayName: Automated test suite
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies

    - script: |
        pytest -v
      displayName: Run automated tests


- stage: ManualAttestation
  displayName: Manual attestation gate
  dependsOn: Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: AttestManualVerification
    displayName: Human verifies Teams/Copilot Studio end-to-end behavior
    environment: MAQ-Delivery-ManualGate
    strategy:
      runOnce:
        deploy:
          steps:
            - script: |
                echo "Manual attestation recorded for commit $(Build.SourceVersion)"
              displayName: Attestation record


- stage: Release
  displayName: PROD / RELEASE
  dependsOn: ManualAttestation
  condition: succeeded()
  jobs:
  - job: TagRelease
    displayName: Tag release version in git
    steps:

    - checkout: self
      persistCredentials: true
      fetchDepth: 0

    - script: |
        git config user.email "pipeline@azure.com"
        git config user.name "Azure Pipeline"
        git tag release-$(Build.BuildNumber)
        git push https://$(AZDO_ALM_PAT)@dev.azure.com/shanmukharegidi/Jarvis/_git/Project release-$(Build.BuildNumber)
      displayName: Tag release