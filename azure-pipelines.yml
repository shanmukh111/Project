trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.13'

stages:

- stage: Validate
  displayName: Validate and Test
  jobs:
  - job: ValidateJob
    displayName: Validate Python application
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: Use Python $(pythonVersion)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies

    - script: |
        python -m compileall agents apps connectors mcp_server orchestration retrieval security reporting
      displayName: Python syntax validation

    - script: |
        pytest -v
      displayName: Run automated tests


- stage: Dev
  displayName: DEV
  dependsOn: Validate
  condition: succeeded()
  jobs:

  - deployment: DeployDev
    displayName: Promote to DEV
    environment: MAQ-Delivery-Dev

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "Promoting build to MAQ-Delivery-Dev"
              echo "Commit: $(Build.SourceVersion)"
              echo "Build: $(Build.BuildNumber)"
            displayName: DEV deployment record


- stage: Test
  displayName: TEST
  dependsOn: Dev
  condition: succeeded()
  jobs:

  - deployment: DeployTest
    displayName: Promote to TEST
    environment: MAQ-Delivery-Test

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "Promoting build to MAQ-Delivery-Test"
              echo "Commit: $(Build.SourceVersion)"
              echo "Build: $(Build.BuildNumber)"
            displayName: TEST deployment record


- stage: Prod
  displayName: PROD
  dependsOn: Test
  condition: succeeded()
  jobs:

  - deployment: DeployProd
    displayName: Promote to PROD
    environment: MAQ-Delivery-Prod

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "Promoting approved build to MAQ-Delivery-Prod"
              echo "Commit: $(Build.SourceVersion)"
              echo "Build: $(Build.BuildNumber)"
            displayName: PROD deployment record